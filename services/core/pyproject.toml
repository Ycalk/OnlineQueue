[project]
name = "core"
version = "0.1.0"
description = ""
authors = [
    {name = "ycalk",email = "alosev752@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.119.0,<0.120.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "sqlalchemy[asyncio] (>=2.0.44,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "dishka[fastapi] (>=1.7.2,<2.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "aio-pika (>=9.5.8,<10.0.0)"
]

[tool.poetry]
packages = [
    {include = "core", from = "src"}, 
    {include = "modules", from = "src"}, 
    {include = "shared", from = "src"}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
aiosqlite = ">=0.21.0,<0.22.0"
alembic = ">=1.17.0,<2.0.0"
pytest-asyncio = ">=1.2.0,<2.0.0"


[tool.poetry.group.migrations.dependencies]
alembic = ">=1.17.2,<2.0.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.migrations]
optional = true

[tool.poetry.scripts]
core = "core.run:run"
