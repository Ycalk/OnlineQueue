[project]
name = "telegram-notification"
version = "0.1.0"
description = ""
authors = [
    {name = "ycalk",email = "alosev752@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram (>=3.23.0,<4.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "aio-pika (>=9.5.8,<10.0.0)",
    "dishka[aiogram] (>=1.7.2,<2.0.0)"
]

[tool.poetry]
packages = [
    {include = "bot", from = "src"},
    {include = "event_processor", from = "src"}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
bot = "bot:run"
